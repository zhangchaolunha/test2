<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#071830" />
  <title>PiXO Demo</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="page-shell">
    <!-- PAGE 01 / HOME -->
    <section class="page-view" data-page="home">
      <section class="pixo-screen home-screen" id="homeScreen" aria-label="PiXO 首页">
        <img class="home-slice hero-slice" src="./assets/home/home-hero.webp" alt="PiXO 首页上半部分像素场景" draggable="false" />
        <img class="home-slice lower-slice" src="./assets/home/home-lower.webp" alt="PiXO 首页属性、事件、Memory 与菜单" draggable="false" />

        <button class="hotspot profile" data-route="detail" aria-label="查看 Mochi 详情"></button>
        <button class="hotspot resource coin" data-action="coin" aria-label="金币"></button>
        <button class="hotspot resource gem" data-action="gem" aria-label="钻石"></button>
        <button class="hotspot resource energy" data-action="energy" aria-label="体力"></button>

        <button class="hotspot side activity" data-action="activity" aria-label="活动"></button>
        <button class="hotspot side travel-side" data-route="travel" aria-label="旅行"></button>
        <button class="hotspot side collection-side" data-route="collection" aria-label="收藏"></button>
        <button class="hotspot side shop-side" data-route="shop" aria-label="商店"></button>

        <button class="hotspot event-mail" data-action="event" aria-label="查看今日事件"></button>
        <button class="hotspot memory-card" data-route="memory" aria-label="查看海边记忆"></button>

        <button class="hotspot nav diary" data-route="diary" aria-label="日志"></button>
        <button class="hotspot nav travel" data-route="travel" aria-label="旅行"></button>
        <button class="hotspot nav collection" data-route="collection" aria-label="收藏"></button>
        <button class="hotspot nav mypixo" data-route="mypixo" aria-label="我的 PiXO"></button>
        <button class="hotspot nav shop" data-route="shop" aria-label="商店"></button>
        <div class="tap-wave"></div>
      </section>
    </section>

    <!-- PAGE 02 / PIXO DETAIL -->
    <section class="page-view" data-page="detail" hidden>
      <section class="pixo-screen detail-screen" id="detailScreen" aria-label="PiXO 详情">
        <img class="detail-slice" src="./assets/detail/detail-header.webp" alt="PiXO 详情页顶部" draggable="false" />
        <img class="detail-slice" src="./assets/detail/detail-hero.webp" alt="Mochi 主视觉与等级" draggable="false" />
        <img class="detail-slice" src="./assets/detail/detail-traits.webp" alt="Form Face Trait Halo" draggable="false" />
        <img class="detail-slice" src="./assets/detail/detail-items.webp" alt="携带物品" draggable="false" />
        <img class="detail-slice" src="./assets/detail/detail-cta.webp" alt="出发按钮" draggable="false" />

        <button class="detail-hit detail-back" data-route="home" aria-label="返回首页"></button>
        <button class="detail-hit detail-edit" data-action="edit-pixo" aria-label="编辑 PiXO"></button>

        <button class="detail-hit detail-tab tab-form selected" data-detail-tab="Form" aria-label="Form"></button>
        <button class="detail-hit detail-tab tab-face" data-detail-tab="Face" aria-label="Face"></button>
        <button class="detail-hit detail-tab tab-trait" data-detail-tab="Trait" aria-label="Trait"></button>
        <button class="detail-hit detail-tab tab-halo" data-detail-tab="Halo" aria-label="Halo"></button>

        <button class="detail-hit item-slot item-1 selected" data-item="能量饮料" aria-label="能量饮料"></button>
        <button class="detail-hit item-slot item-2 selected" data-item="探险锤" aria-label="探险锤"></button>
        <button class="detail-hit item-slot item-3 selected" data-item="旅行票" aria-label="旅行票"></button>

        <button class="detail-hit detail-start" data-route="travel" aria-label="装备 Mochi 出发"></button>
        <div class="tap-wave"></div>
      </section>
    </section>

    <!-- PAGE 03 / PREPARE TRAVEL -->
    <section class="page-view" data-page="travel" hidden>
      <section class="pixo-screen travel-screen" id="travelScreen" aria-label="准备旅行">
        <img class="travel-prep-art" src="./assets/travel/prepare-page.webp" alt="PiXO 准备旅行页面" draggable="false" />

        <button class="travel-hit travel-back" data-route="detail" aria-label="返回 PiXO 详情"></button>
        <button class="travel-hit travel-help" data-action="travel-help" aria-label="旅行说明"></button>
        <button class="travel-hit destination-hit" data-action="destination" aria-label="查看海边小镇"></button>

        <button class="travel-duration duration-short" data-duration="short">短途</button>
        <button class="travel-duration duration-normal selected" data-duration="normal">✦ 普通</button>
        <button class="travel-duration duration-long" data-duration="long">长途</button>

        <div class="travel-count" id="travelItemCount">携带物品（3/5）</div>
        <button class="travel-item selected item-drink" data-travel-item="能量饮料" aria-label="能量饮料"></button>
        <button class="travel-item selected item-tool" data-travel-item="寻宝工具" aria-label="寻宝工具"></button>
        <button class="travel-item selected item-ticket" data-travel-item="旅行票" aria-label="旅行票"></button>
        <button class="travel-item empty item-empty-1" data-action="empty-slot" aria-label="空物品槽"></button>
        <button class="travel-item empty item-empty-2" data-action="empty-slot" aria-label="空物品槽"></button>

        <button class="travel-start" id="travelStartBtn" aria-label="让 Mochi 出发"></button>
        <div class="travel-draft" id="travelDraft">海边小镇 · 普通 · 3 件物品</div>
        <div class="tap-wave"></div>
      </section>
    </section>

    <aside class="build-note" id="buildNote">
      <span id="buildPage">PAGE 01 / HOME</span>
      <strong id="buildTitle">首页 · 像素生活场景</strong>
      <p id="buildText">点击左上 Mochi 资料卡进入第 2 页；也可以直接点击旅行进入第 3 页。</p>
    </aside>
  </main>

  <div class="route-preview" id="routePreview" aria-hidden="true">
    <div class="preview-panel">
      <button class="preview-close" id="previewClose">×</button>
      <small>NEXT PAGE</small>
      <h2 id="previewTitle">旅行中</h2>
      <p id="previewText">下一页继续按照“大图 → 小图 → 代码 → 交互”的顺序实现。</p>
      <button class="preview-primary" id="previewBack">返回当前页面</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="./app.js"></script>
</body>
</html>
